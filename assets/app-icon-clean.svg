<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for background -->
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D6001C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B30019;stop-opacity:1" />
    </linearGradient>
    
    <!-- Text shadow filter -->
    <filter id="textShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="1024" height="1024" rx="180" ry="180" fill="url(#backgroundGradient)"/>
  
  <!-- Subtle highlight overlay -->
  <rect width="1024" height="1024" rx="180" ry="180" 
        fill="linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.0) 50%, rgba(0,0,0,0.05) 100%)"/>
  
  <!-- Main text "Let'Split" -->
  <text x="512" y="540" 
        font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif" 
        font-size="120" 
        font-weight="900" 
        text-anchor="middle" 
        fill="white" 
        filter="url(#textShadow)"
        letter-spacing="-2px">Let'Split</text>
  
  <!-- Minimal decorative accents -->
  <circle cx="512" cy="280" r="4" fill="rgba(255,255,255,0.6)"/>
  <circle cx="512" cy="744" r="4" fill="rgba(255,255,255,0.6)"/>
  
  <!-- Subtle side accents -->
  <circle cx="220" cy="512" r="3" fill="rgba(255,255,255,0.4)"/>
  <circle cx="804" cy="512" r="3" fill="rgba(255,255,255,0.4)"/>
</svg>
