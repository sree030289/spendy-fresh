<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D6001C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF4D6D;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for bill/receipt -->
    <linearGradient id="receiptGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F8F9FA;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for coins -->
    <linearGradient id="coinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="6" stdDeviation="8" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
    
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="512" cy="512" r="480" fill="url(#bgGradient)" stroke="#B91C1C" stroke-width="8"/>
  
  <!-- Main Receipt/Bill -->
  <rect x="280" y="180" width="280" height="400" rx="20" ry="20" 
        fill="url(#receiptGradient)" 
        stroke="#E5E7EB" 
        stroke-width="3" 
        filter="url(#shadow)"/>
  
  <!-- Receipt perforated top -->
  <path d="M280 200 L290 190 L300 200 L310 190 L320 200 L330 190 L340 200 L350 190 L360 200 L370 190 L380 200 L390 190 L400 200 L410 190 L420 200 L430 190 L440 200 L450 190 L460 200 L470 190 L480 200 L490 190 L500 200 L510 190 L520 200 L530 190 L540 200 L550 190 L560 200" 
        fill="#E5E7EB" stroke="none"/>
  
  <!-- Receipt Lines (representing items) -->
  <rect x="320" y="240" width="200" height="8" rx="4" fill="#6B7280"/>
  <rect x="320" y="260" width="160" height="6" rx="3" fill="#9CA3AF"/>
  <rect x="320" y="280" width="180" height="6" rx="3" fill="#9CA3AF"/>
  <rect x="320" y="300" width="140" height="6" rx="3" fill="#9CA3AF"/>
  
  <!-- Splitting Line (Dashed line through middle) -->
  <line x1="420" y1="320" x2="420" y2="480" 
        stroke="#D6001C" 
        stroke-width="6" 
        stroke-dasharray="15,10" 
        filter="url(#glow)"/>
  
  <!-- Split Arrow pointing down -->
  <path d="M410 460 L420 480 L430 460" 
        fill="none" 
        stroke="#D6001C" 
        stroke-width="6" 
        stroke-linecap="round" 
        filter="url(#glow)"/>
  
  <!-- Left side amount -->
  <text x="360" y="350" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#374151" text-anchor="middle">$25</text>
  
  <!-- Right side amount -->
  <text x="480" y="350" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#374151" text-anchor="middle">$25</text>
  
  <!-- Two coins representing split payment -->
  <!-- Left coin -->
  <circle cx="360" y="520" r="35" fill="url(#coinGradient)" stroke="#B45309" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="530" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#92400E" text-anchor="middle">$</text>
  
  <!-- Right coin -->
  <circle cx="480" y="520" r="35" fill="url(#coinGradient)" stroke="#B45309" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="530" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#92400E" text-anchor="middle">$</text>
  
  <!-- People icons (simplified) -->
  <!-- Left person -->
  <circle cx="200" cy="420" r="25" fill="#FFFFFF" stroke="#D6001C" stroke-width="3"/>
  <circle cx="200" cy="410" r="12" fill="#D6001C"/>
  <rect x="188" y="430" width="24" height="30" rx="12" fill="#D6001C"/>
  
  <!-- Right person -->
  <circle cx="640" cy="420" r="25" fill="#FFFFFF" stroke="#D6001C" stroke-width="3"/>
  <circle cx="640" cy="410" r="12" fill="#D6001C"/>
  <rect x="628" y="430" width="24" height="30" rx="12" fill="#D6001C"/>
  
  <!-- Connection lines from people to coins -->
  <line x1="225" y1="440" x2="325" y2="520" stroke="#D6001C" stroke-width="3" stroke-dasharray="8,4" opacity="0.8"/>
  <line x1="615" y1="440" x2="515" y2="520" stroke="#D6001C" stroke-width="3" stroke-dasharray="8,4" opacity="0.8"/>
  
  <!-- App name at bottom -->
  <text x="512" y="780" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#FFFFFF" text-anchor="middle" filter="url(#shadow)">Let'Split</text>
  
  <!-- Subtitle -->
  <text x="512" y="820" font-family="Arial, sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle" opacity="0.9">Split Bills Easy</text>
</svg>
