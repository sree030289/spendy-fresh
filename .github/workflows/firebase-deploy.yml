name: Deploy to Firebase Production

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.json'
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: 'Deploy Cloud Functions'
        required: true
        type: boolean
        default: true
      deploy_firestore:
        description: 'Deploy Firestore Rules & Indexes'
        required: true
        type: boolean
        default: true
      deploy_storage:
        description: 'Deploy Storage Rules'
        required: true
        type: boolean
        default: true

jobs:
  deploy-firebase:
    name: Deploy to Firebase Production (Spendy)
    runs-on: ubuntu-latest
    
    steps:
      - name: 🏗 Check out repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 📦 Install root dependencies
        run: npm install --force

      - name: 📦 Install Firebase Functions dependencies
        working-directory: ./functions
        run: npm install --force

      - name: 🔍 Lint Firebase Functions
        working-directory: ./functions
        run: npm run lint || echo "Linting completed with warnings"

      - name: 🧪 Run Tests (if available)
        working-directory: ./functions
        run: npm test || echo "No tests configured"
        continue-on-error: true

      - name: 🔥 Deploy Cloud Functions
        if: ${{ github.event.inputs.deploy_functions != 'false' }}
        run: |
          npx firebase-tools@latest deploy --only functions --project spendy-97913
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPENDY }}

      - name: 🔥 Deploy Firestore Rules
        if: ${{ github.event.inputs.deploy_firestore != 'false' }}
        run: |
          npx firebase-tools@latest deploy --only firestore:rules --project spendy-97913
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPENDY }}

      - name: 🔥 Deploy Firestore Indexes
        if: ${{ github.event.inputs.deploy_firestore != 'false' }}
        run: |
          npx firebase-tools@latest deploy --only firestore:indexes --project spendy-97913
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPENDY }}

      - name: 🔥 Deploy Storage Rules
        if: ${{ github.event.inputs.deploy_storage != 'false' }}
        run: |
          npx firebase-tools@latest deploy --only storage --project spendy-97913
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPENDY }}

      - name: 🔥 Deploy All Firebase Services
        if: ${{ github.event.inputs.deploy_functions == '' && github.event.inputs.deploy_firestore == '' && github.event.inputs.deploy_storage == '' }}
        run: |
          npx firebase-tools@latest deploy --project spendy-97913
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPENDY }}

      - name: ✅ Deployment Summary
        run: |
          echo "### 🎉 Firebase Deployment Complete! ###"
          echo "Project: spendy-97913 (Production)"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "Deployed Services:"
          if [ "${{ github.event.inputs.deploy_functions }}" != "false" ]; then
            echo "  ✓ Cloud Functions"
          fi
          if [ "${{ github.event.inputs.deploy_firestore }}" != "false" ]; then
            echo "  ✓ Firestore Rules & Indexes"
          fi
          if [ "${{ github.event.inputs.deploy_storage }}" != "false" ]; then
            echo "  ✓ Storage Rules"
          fi
          echo ""
          echo "Firebase Console: https://console.firebase.google.com/project/spendy-97913"

      - name: 💬 Notify on Failure
        if: failure()
        run: |
          echo "::error::Firebase deployment failed! Check the logs above for details."

      - name: 🔔 Send Deployment Status
        if: always()
        run: |
          echo "Deployment status: ${{ job.status }}"